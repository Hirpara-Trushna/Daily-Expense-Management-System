<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Income - Daily Expense Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">💰 Expense Manager</a>
        <div class="navbar-nav">
            <a class="nav-link text-light" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-light" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link text-light" th:href="@{/income}">Income</a>
            <a class="nav-link text-light" th:href="@{/report}">Report</a>
            <a class="nav-link text-light" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-7">
            <h3>My Income</h3>
            <div class="card p-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Source</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="i : ${incomes}">
                            <td th:text="${i.source}"></td>
                            <td th:text="${i.category.name}"></td>
                            <td th:text="'₹ ' + ${i.amount}"></td>
                            <td th:text="${i.date}"></td>
                            <td>
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{/income/delete/{id}(id=${i.id})}"
                                   onclick="return confirm('Delete this income?');">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(incomes)}">
                            <td colspan="5" class="text-muted text-center">No income recorded yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-5">
            <h3>Add Income</h3>
            <div class="card p-4">
                <form th:action="@{/income/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Source</label>
                        <input type="text" class="form-control" name="source" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control" name="amount" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="categoryName" required>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" name="date">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Save Income</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
