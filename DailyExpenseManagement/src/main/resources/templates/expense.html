<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expenses - Daily Expense Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">💰 Expense Manager</a>
        <div class="navbar-nav">
            <a class="nav-link text-light" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-light" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link text-light" th:href="@{/income}">Income</a>
            <a class="nav-link text-light" th:href="@{/report}">Report</a>
            <a class="nav-link text-light" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>My Expenses</h3>
        <a class="btn btn-danger" th:href="@{/expenses/add}">+ Add Expense</a>
    </div>

    <div class="card p-3">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${expenses}">
                    <td th:text="${e.description}"></td>
                    <td th:text="${e.category.name}"></td>
                    <td th:text="'₹ ' + ${e.amount}"></td>
                    <td th:text="${e.date}"></td>
                    <td>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{/expenses/delete/{id}(id=${e.id})}"
                           onclick="return confirm('Delete this expense?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(expenses)}">
                    <td colspan="5" class="text-muted text-center">No expenses recorded yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
