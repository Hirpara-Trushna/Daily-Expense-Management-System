# ============================
# Server settings
# ============================
server.port=8080

# ============================
# Database settings (H2 - file based, no installation needed)
# The database file will be created automatically in the project folder
# as "expensedb.mv.db"
# ============================
spring.datasource.url=jdbc:h2:file:./expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update tables based on the Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (optional) - lets you view the database in a browser
# Visit http://localhost:8080/h2-console after starting the app
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================
# Thymeleaf settings
# ============================
spring.thymeleaf.cache=false
