<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Expense - Daily Expense Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">💰 Expense Manager</a>
        <div class="navbar-nav">
            <a class="nav-link text-light" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-light" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link text-light" th:href="@{/income}">Income</a>
            <a class="nav-link text-light" th:href="@{/report}">Report</a>
            <a class="nav-link text-light" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card p-4" style="max-width: 500px; margin: auto;">
        <h4 class="mb-4">Add New Expense</h4>

        <form th:action="@{/expenses/add}" method="post">
            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" name="description" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" step="0.01" class="form-control" name="amount" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="categoryName" required>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date">
            </div>

            <button type="submit" class="btn btn-danger w-100">Save Expense</button>
            <a th:href="@{/expenses}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
