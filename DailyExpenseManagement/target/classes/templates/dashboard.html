<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Daily Expense Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">💰 Expense Manager</a>
        <div class="navbar-nav">
            <a class="nav-link text-light" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link text-light" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link text-light" th:href="@{/income}">Income</a>
            <a class="nav-link text-light" th:href="@{/report}">Report</a>
            <a class="nav-link text-light" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h3>Welcome, <span th:text="${user.username}"></span> 👋</h3>
    <p class="text-muted">Here is a quick summary of your finances.</p>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card summary-card p-3 text-center">
                <p class="text-muted mb-1">Total Income</p>
                <h3 class="summary-income" th:text="'₹ ' + ${totalIncome}"></h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card summary-card p-3 text-center">
                <p class="text-muted mb-1">Total Expense</p>
                <h3 class="summary-expense" th:text="'₹ ' + ${totalExpense}"></h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card summary-card p-3 text-center">
                <p class="text-muted mb-1">Balance</p>
                <h3 class="summary-balance" th:text="'₹ ' + ${balance}"></h3>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Recent Expenses</h5>
                <table class="table table-sm">
                    <thead>
                        <tr><th>Description</th><th>Category</th><th>Amount</th><th>Date</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${recentExpenses}">
                            <td th:text="${e.description}"></td>
                            <td th:text="${e.category.name}"></td>
                            <td th:text="${e.amount}"></td>
                            <td th:text="${e.date}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentExpenses)}">
                            <td colspan="4" class="text-muted">No expenses added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h5>Recent Income</h5>
                <table class="table table-sm">
                    <thead>
                        <tr><th>Source</th><th>Category</th><th>Amount</th><th>Date</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="i : ${recentIncomes}">
                            <td th:text="${i.source}"></td>
                            <td th:text="${i.category.name}"></td>
                            <td th:text="${i.amount}"></td>
                            <td th:text="${i.date}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentIncomes)}">
                            <td colspan="4" class="text-muted">No income added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
